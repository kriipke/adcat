name: adcat
version: ${VERSION}
section: utils
priority: optional
maintainer: kriipke <kriipke@users.noreply.github.com>
description: cat for markdown and asciidoc: Show documents in terminals
homepage: https://github.com/kriipke/adcat
license: MPL-2.0
contents:
  - src: ./target/${TARGET}/release/adcat
    dst: /usr/bin/adcat
  - src: ./adcat.1
    dst: /usr/share/man/man1/adcat.1
  - src: ./README.md
    dst: /usr/share/doc/adcat/README.md
  - src: ./LICENSE
    dst: /usr/share/doc/adcat/LICENSE

overrides:
  deb:
    arch: ${DEB_ARCH}
    depends:
      - libcurl4
      - libfontconfig1
  rpm:
    arch: ${RPM_ARCH}
    depends:
      - libcurl
      - fontconfig
