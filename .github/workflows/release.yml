name: Release

on:
  push:
    tags: ["*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-tag:
    name: "Validate Tag"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate semver tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${VERSION}' is not a supported semver release tag" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # On tag push: build manpage artifact
  build-manpage:
    name: "Build Manpage"
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build manpage
        uses: docker://asciidoctor/docker-asciidoctor
        with:
          args: asciidoctor -b manpage -a reproducible adcat.1.adoc
      - uses: actions/upload-artifact@v4
        with:
          name: adcat.1
          path: adcat.1

  # On tag push: build all targets, package tarballs + .deb/.rpm
  build:
    name: "Build (${{ matrix.target }})"
    needs: [validate-tag, build-manpage]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            deb_arch: arm64
            rpm_arch: aarch64
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download manpage
        uses: actions/download-artifact@v4
        with:
          name: adcat.1

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Set up Go
        if: matrix.deb_arch != ''
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install nfpm
        if: matrix.deb_arch != ''
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install system dependencies
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libfontconfig1-dev

      - name: Build
        shell: bash
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --locked --target ${{ matrix.target }} --release

      - name: Strip binary
        if: "!matrix.use_cross && !contains(matrix.target, 'windows')"
        shell: bash
        run: strip "target/${{ matrix.target }}/release/adcat"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${{ needs.validate-tag.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Package tarball / zip
        id: package
        shell: bash
        run: ./scripts/package '${{ steps.version.outputs.version }}' '${{ matrix.target }}'

      - name: Package .deb and .rpm
        if: matrix.deb_arch != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          envsubst < packaging/nfpm.yaml > nfpm.yaml
          nfpm package --target deb
          nfpm package --target rpm

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.file }}

      - name: Upload tarball / zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.file }}

      - name: Upload .deb
        if: matrix.deb_arch != ''
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: "*.deb"

      - name: Upload .rpm
        if: matrix.deb_arch != ''
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: "*.rpm"

  # On tag push: create GitHub release with all artifacts
  publish:
    name: "Publish Release"
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Collect artifacts
        run: mkdir -p assets && find ./artifacts -type f -exec mv {} assets/ \;
      - name: Generate checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && b2sum * > B2SUMS.txt
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${{ needs.validate-tag.outputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "adcat ${{ steps.version.outputs.version }}"
          body_path: CHANGELOG.md
          files: "assets/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
